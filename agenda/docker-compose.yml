services:
  db:
    image: mysql:8.0
    container_name: mysql_db
    restart: always
    # Força o método de senha compatível com DBeaver/Eclipse
    command: --default-authentication-plugin=mysql_native_password
    environment:
      - MYSQL_ROOT_PASSWORD=root
      - MYSQL_DATABASE=agenda
    ports:
      - "3307:3306" # Usaremos a 3307 no Windows para não dar conflito
    volumes:
      - mysql_data:/var/lib/mysql

volumes:
  mysql_data: